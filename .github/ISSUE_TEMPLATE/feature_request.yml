name: 💡 Feature Request
description: Propose an enhancement or improvement to the HyperCraft suite
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: What capability would you like to see improved?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this needed?
      description: How does this help autonomous AI agents write better code?
    validations:
      required: true